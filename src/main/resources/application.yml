spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: ${DDL_AUTO}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}

server:
  host: ${HOST_URL}
  tomcat:
    accept-count: 10000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

kakao:
  pay:
    secret-key: ${KAKAO_PAY_SECRET_KEY}

storage:
  file-system:
    location: /tmp/spring-boot-upload
  s3:
    bucket-name: ${S3_BUCKET_NAME}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
  tus:
    storage-path: /tmp/tus-upload
    upload-uri: /api/v1/images/upload
    upload-expiration: 86400
cloudfront:
  domain-name: ${CLOUDFRONT_DOMAIN_NAME:0.0.0.0}

management:
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: "*"
  server:
    port: 8080

logging:
  level:
    com.sellect.server.search.batch: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
  data:
    redis:
      protocol: rediss://