plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id "org.springdoc.openapi-gradle-plugin" version "1.8.0"
    id 'jacoco'
}

group = 'com.sellect'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0' // 최신 버전으로 변경
    implementation('com.amazonaws:aws-java-sdk-s3:1.12.699') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'me.desair.tus:tus-java-server:1.0.0-3.0'


    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 모니터링 관련 의존성 추가
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // Testcontainers 의존성 추가
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:mysql"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers"

    // QueryDSL 의존성 추가
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Hibernate 6.4.1 사용
    implementation 'org.hibernate:hibernate-core:6.4.1.Final'

    // Blaze-Persistence 최신 버전 사용 (Hibernate 6.2과 호환)
    // Blaze-Persistence Core API (Jakarta 지원)
    implementation 'com.blazebit:blaze-persistence-core-api-jakarta:1.6.14'
    //Blaze-Persistence Core Implementation (Jakarta 지원)
    runtimeOnly 'com.blazebit:blaze-persistence-core-impl-jakarta:1.6.14'
    // Blaze-Persistence Hibernate 6.2 통합 모듈 (최신 버전)
    runtimeOnly 'com.blazebit:blaze-persistence-integration-hibernate-6.2:1.6.14'
    // Blaze-Persistence QueryDSL Integration
    implementation 'com.blazebit:blaze-persistence-integration-querydsl-expressions-jakarta:1.6.14'


    // Redis 의존성 추가
    implementation 'org.redisson:redisson-spring-boot-starter:3.17.7'

//	implementation 'org.flywaydb:flyway-core'
//	implementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // 테스트 후 JaCoCo 리포트 자동 생성
}

// QueryDSL 관련 설정
def querydslSrcDir = 'src/main/generated'
clean {
    delete file(querydslSrcDir)
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslSrcDir)
}

jacoco {
    toolVersion = "0.8.12" // 2025년 2월 기준 최신 버전
}

jacocoTestReport {
    dependsOn test // 테스트가 실행된 후에 리포트 생성
    reports {
        xml.required = true  // XML 리포트 생성 (CI 도구에서 활용 가능)
        csv.required = false
        html.required = true // HTML 리포트 생성 (브라우저로 확인 가능)
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml') // 리포트 저장 경로
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/*Entity.class',      // 엔티티 제외
                    '**/*Config.class',      // 설정 클래스 제외
                    '**/Q*.class',            // QueryDSL Q클래스 제외
                    '**/*$*Builder.class'    // Lombok이 생성한 빌더 클래스 제외 (추가)
            ])
        }))
    }
}


