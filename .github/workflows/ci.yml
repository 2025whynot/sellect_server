name: CI with Gradle

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop" ]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clear Gradle Cache
        run: |
          echo "Deleting Gradle cache..."
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
          echo "Gradle cache deleted!"

      - name: Install yq
        run: |
          sudo snap install yq

      - name: Set application.yml with yq
        run: |
          # 공통 설정 (첫 번째 문서, 인덱스 0) 치환
          yq eval -i '
            .spring.datasource.url = "${{ secrets.DB_URL }}" |
            .spring.datasource.username = "${{ secrets.DB_USERNAME }}" |
            .spring.datasource.password = "${{ secrets.DB_PASSWORD }}" |
            .spring.jpa.hibernate.ddl-auto = "${{ secrets.DDL_AUTO }}" |
            .jwt.secret = "${{ secrets.JWT_SECRET }}" |
            .jwt.expiration = "${{ secrets.JWT_EXPIRATION }}" |
            .kakao.pay.secret-key = "${{ secrets.KAKAO_PAY_SECRET_KEY }}" |
            .storage.s3.bucket-name = "${{ secrets.S3_BUCKET_NAME }}" |
            .storage.s3.access-key = "${{ secrets.S3_ACCESS_KEY }}" |
            .storage.s3.secret-key = "${{ secrets.S3_SECRET_KEY }}" |
            .storage.s3.region = "${{ secrets.S3_REGION }}" |
            .server.host = "${{ secrets.HOST_URL }}"
          ' ./src/main/resources/application.yml

          # prod 프로파일 설정 (두 번째 문서, 인덱스 1) 치환
          yq eval -i '
            select(di == 1) | 
            .spring.data.redis.host = "${{ secrets.REDIS_HOST }}" |
            .spring.data.redis.port = "${{ secrets.REDIS_PORT }}"
          ' ./src/main/resources/application.yml

      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      - name: Build With Gradle
        run: ./gradlew build --no-build-cache --refresh-dependencies -x test

      - name: 테스트 코드 실행
        run: ./gradlew --info test --no-build-cache --refresh-dependencies

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v1
        if: ${{ always() }}
        with:
          files: build/test-results/**/*.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v3
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'